Matte.PauseLength="Pause Length"
Matte.PauseLength.Description="Holds the cutout still part way through, as a share of the transition - the cartoon iris that stops on a circle before closing. 0 is no pause. Overshoot shows best with a pause, which gives it something to settle onto."
Matte.PauseSize="Pause Size"
Matte.PauseSize.Description="How big the cutout is while it pauses, as a share of the size it needs to fill the canvas."

Matte.Feather="Edge Softness"
Matte.Feather.Description="How far each edge fades, in pixels. 0 is a hard cut."
Matte.Border="Border Width"
Matte.Border.Description="A solid band riding the cutout's edge. 0 is no border."
