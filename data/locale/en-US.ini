Constellations.Border.RoundSource.Tooltip="Clips the source's corners to match the frame so nothing pokes out past rounded corners. Inside, the source follows the frame's outer edge. Outside, it follows the frame's inner edge, which is only rounded when the Corner Radius is larger than the border width."
Constellations.Border.Layout="Shape Layout"
Constellations.Border.Layout.Perimeter="Follow Perimeter"
Constellations.Border.Layout.Masked="Masked Pattern"
Constellations.Border.Layout.Tooltip="Follow Perimeter places shapes in rows that run around the frame, spaced evenly so each side holds whole shapes, with a shape on every sharp corner. Motion Speed marches them around the frame. Masked Pattern shows the regular pattern grid only inside the border band, with the usual anchor, rotation and motion angle."
Constellations.Border.Rows="Rows"
Constellations.Border.Stagger="Stagger Alternate Rows"
Constellations.Border.Align="Align Shapes to Edge"
Constellations.Border.Align.Tooltip="Turns each shape to follow its side, with its top facing out of the frame. When off, every shape stays upright and only the item's own rotation applies."
Constellations.Border.Clip="Clip Shapes to Border"
Constellations.Border.Clip.Tooltip="Cuts shapes off at the edges of the band. Turn it off to let large shapes spill inward over the source."
Constellations.Border.OffsetX.Tooltip="With Follow Perimeter, slides the shapes along the frame instead of sideways."
Constellations.Border.OffsetY.Tooltip="With Follow Perimeter, moves the shapes toward the inside of the frame (negative values move them outward)."
Constellations.Border.MotionSpeed.Tooltip="With Follow Perimeter, positive speeds march the shapes clockwise around the frame and negative speeds counterclockwise."

